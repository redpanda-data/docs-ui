    - &latest_version_xyz
      url: /streaming/6.0/index.html
      version: '6.0'
      displayVersion: '6.0'
      asciidoc:
        attributes:
          latest-redpanda-tag: 'v25.1.1'
          component-metadata:
            title: Streaming
            parent-component: self-managed
            description: Run Redpanda on your own infrastructure.
            color: '#4D7C0F'
            icon: activity
            order: 1
    - &component_version
      title: *component_title
      url: '#'
      version: '24.3'
      displayVersion: '24.3'
      asciidoc:
        attributes:
          latest-redpanda-tag: 'v24.3.1'
          component-metadata:
            title: Streaming
            parent-component: self-managed
            description: Run Redpanda on your own infrastructure.
            color: '#4D7C0F'
            icon: activity
            order: 1
