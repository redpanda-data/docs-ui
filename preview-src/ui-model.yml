    - &latest_version_sm
      url: '#'
      version: '1.0'
      displayVersion: '1.0'
      asciidoc:
        attributes:
          component-metadata:
            title: Self-Managed
            description: Run Redpanda on your own infrastructure.
            color: '#9F1239'
