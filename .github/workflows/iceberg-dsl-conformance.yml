name: Iceberg DSL conformance

# Verifies the Iceberg Mode Explorer's config-string parser and builder
# (src/js/iceberg-explorer.js) against Redpanda's accept, reject, message
# and format cases from src/v/model/tests/iceberg_mode_test.cc, copied into
# tests/iceberg-explorer/fixtures/upstream-vectors.js.
#
# The vector tests always run. On a schedule / manual dispatch the job also
# fetches the current C++ test file from a chosen ref and greps for the
# expected format strings, so upstream DSL changes surface as a failing check
# even before anyone updates the fixture.

on:
  pull_request:
    paths:
      - 'src/js/iceberg-explorer.js'
      - 'tests/iceberg-dsl/**'
      - 'tests/iceberg-explorer/**'
  workflow_dispatch:
    inputs:
      redpanda_ref:
        description: 'redpanda ref to diff the DSL vectors against'
        required: false
        default: 'dev'
  schedule:
    - cron: '0 6 * * 1' # weekly: catch upstream DSL drift

jobs:
  conformance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # This job only reads the checkout, so don't leave GITHUB_TOKEN in the
      # runner's git config for the rest of the job.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        # The explorer DOM tests need jsdom. Nothing in this job uses
        # Puppeteer's Chrome, so skip its download (see validate-build.yml).
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci

      - name: Run DSL conformance vectors
        run: npm run test:iceberg-dsl

      - name: Run the explorer unit and DOM tests
        run: npm run test:iceberg-explorer

      - name: Cross-check vectors against upstream iceberg_mode_test.cc
        if: github.event_name != 'pull_request'
        env:
          REF: ${{ github.event.inputs.redpanda_ref || 'dev' }}
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/redpanda-data/redpanda/$REF/src/v/model/tests/iceberg_mode_test.cc"
          curl -fsSL "$url" -o upstream_iceberg_mode_test.cc
          # Merge C++ adjacent string-literal concatenation ("a" "b" -> "ab"),
          # including across line breaks, so long expected strings that the test
          # file wraps still match.
          norm="$(tr -d '\n' < upstream_iceberg_mode_test.cc | sed 's/"[[:space:]]*"//g')"
          # Every expected string in our conformance vectors must still appear
          # verbatim in the upstream C++ format tests.
          missing=0
          while IFS= read -r expected; do
            [ -z "$expected" ] && continue
            if ! printf '%s' "$norm" | grep -qF -- "$expected"; then
              echo "::warning::Expected DSL string not found upstream ($REF): $expected"
              missing=$((missing+1))
            fi
          done < <(grep -oE "expected: '[^']+'" tests/iceberg-explorer/fixtures/upstream-vectors.js | sed "s/expected: '//; s/'$//")
          if [ "$missing" -gt 0 ]; then
            echo "$missing expected DSL string(s) no longer present upstream. The DSL may have changed: re-sync tests/iceberg-explorer/fixtures/upstream-vectors.js (and its docs-extensions-and-macros copy), then the spec in src/js/iceberg-explorer.js."
            exit 1
          fi
          echo "All DSL vectors still present in upstream iceberg_mode_test.cc @ $REF"
