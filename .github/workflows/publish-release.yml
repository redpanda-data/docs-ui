---
  name: publish-release

  on:
    push:
      tags: ['v*']

  jobs:
    build:
      runs-on: ubuntu-22.04
      timeout-minutes: 20
      permissions:
        contents: write

      env:
        ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
        ALGOLIA_APP_ID: ${{ vars.ALGOLIA_APP_ID }}
        ALGOLIA_INDEX_NAME: ${{ vars.ALGOLIA_INDEX_NAME }}
        # puppeteer (devDep, used only by the playground tests — not the bundle)
        # downloads ~120 MB of Chromium on install, which repeatedly stalled
        # `npm ci` on CI for the full 20-min timeout. The release build doesn't
        # use puppeteer, so skip the browser download.
        PUPPETEER_SKIP_DOWNLOAD: 'true'

      steps:
        - uses: actions/checkout@v4

        - name: Set up Go
          uses: actions/setup-go@v5
          with:
            go-version: stable
            cache-dependency-path: blobl-editor/wasm/go.sum

        - uses: actions/setup-node@v4
          with:
            node-version: 18
            # Cache the npm download cache (~/.npm), keyed by the lockfile. More
            # reliable than caching node_modules: it's saved as a post-step even
            # when a later step fails, so it survives the cancelled-on-timeout
            # runs that left the old node_modules cache permanently empty.
            cache: npm

        - name: Install dependencies
          run: npm ci --no-audit --no-fund --prefer-offline

        - run: gulp bundle

        - name: Create GitHub Release (prerelease aware)
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            TAG="${{ github.ref_name }}"
            ASSET=./build/ui-bundle.zip
            FLAGS="--generate-notes"
            if [[ "$TAG" =~ - ]]; then
              FLAGS+=" --prerelease"
            fi
            gh release create "$TAG" $ASSET $FLAGS

        - name: Trigger Netlify Build Hook
          run: curl -X POST -d '{}' https://api.netlify.com/build_hooks/64e4682992f9ec30865c7c0b
