---
# This workflow makes sure that the UI builds without errors.
# The push:[main] trigger also warms the branch-scoped node_modules cache on
# every merge, so tag-triggered publish-release runs can restore it (caches are
# only restorable from the same ref or the default branch).
name: validate-build
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-22.04
    # Warm-cache runs take 1-2 minutes, but that figure is not what the cap has
    # to clear. A cold run is dominated by `npm ci`: runs 33752155131 and
    # 32899354267 took 7.2 and 7.0 minutes with the install step at 5.4 and 5.8
    # of them. Skipping Puppeteer's Chrome download below (nothing in this job
    # uses Chrome) takes most of that back, which is what leaves 15 minutes
    # generous over a legitimate cold run rather than merely twice it.
    #
    # Without a cap, a wedged npm ci (seen when the node_modules cache expires
    # and the registry stalls) burns the runner for GitHub's full 6-hour default
    # before the job is cancelled. Note a job cancelled by timeout-minutes never
    # runs the cache save (actions/cache@v4 is post-if: success()), so the cap
    # has to stay clear of the cold path or a slow-registry day leaves the cache
    # empty for everyone.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: blobl-editor/wasm/go.sum
      - name: Lint Go code
        uses: golangci/golangci-lint-action@v8
        timeout-minutes: 10
        with:
          working-directory: "./blobl-editor/wasm"
        env:
          GOOS: js
          GOARCH: wasm
      - name: Ensure wasm_exec.js is up to date
        run: |
          diff -q $(go env GOROOT)/lib/wasm/wasm_exec.js ./src/js/vendor/wasm_exec.js &>/dev/null || { >&2 echo "Stale wasm_exec.js detected."; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        # puppeteer (devDep) downloads ~120 MB of Chromium on install, which is
        # roughly 5 of the 7 cold minutes and repeatedly stalled `npm ci`.
        # Nothing in this job needs it: `gulp bundle` and the node --test suites
        # below are Chrome-free, and puppeteer is only imported by the bloblang,
        # negative-cache and property-tooltips tests, which run in
        # test-bloblang-playground.yml. publish-release.yml already sets this
        # for the same reason.
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci
      - name: Test page actions
        run: npm run test:markdown-dropdown
      - name: Test header sign-in nudge
        run: npm run test:signin-nudge
      - name: Test agent navigation closes the chat panel
        run: npm run test:chat-panel-navigation
      - name: Test Kapa source-group scoping
        run: npm run test:kapa-source-groups
      - name: Test collapsible TOC groups
        run: npm run test:toc-collapsible
      - name: Test anonymous Ask AI quota
        run: npm run test:anon-quota
      - name: Cache generated files
        uses: actions/cache@v4
        with:
          path: |
            src/js/vendor/prism/prism-bloblang.js
            src/static/blobl.wasm
          key: generated-${{ hashFiles('blobl-editor/wasm/go.sum') }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            generated-${{ hashFiles('blobl-editor/wasm/go.sum') }}-
            generated-
      - name: Bundle UI
        timeout-minutes: 10
        run: gulp bundle
