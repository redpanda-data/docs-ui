name: Build Iceberg engine (WASM)

# Builds the Iceberg Mode Explorer's engine for each supported docs version of
# streaming, from that major.minor's latest patch release of Redpanda, and
# opens a PR to redpanda-data/docs adding it to that version's branch:
#
#   modules/reference/attachments/iceberg-engine-<X.Y>.js
#   modules/reference/attachments/iceberg-engine-<X.Y>.wasm
#   modules/reference/attachments/iceberg-engine-<X.Y>.json   (provenance)
#
# head-meta.hbs points each streaming page at its version's engine, and the
# explorer checks the engine was built from that release before using it.
#
# The engine is Redpanda's own C++ for that release: the redpanda.iceberg.mode
# parser and formatter from model.cc (extract-iceberg-mode.js) and, where it
# compiles, the Avro -> Iceberg schema mapper. Each build is checked by the
# release's own iceberg_mode_test.cc (where the release has one) and by
# tests/iceberg-engine, which also runs the upstream vectors on builds with
# the section format.
#
# Which versions to build (iceberg-editor/ci/engine-targets.js): every docs
# branch (main, v/X.Y) still inside the support window the docs use for end
# of life, whose published engine is not from the latest patch tag. Daily, so
# a new patch release reaches the docs within a day.
#
# Redpanda's source (redpanda-data/streaming-enterprise) and the docs repo are
# private, so every job reads them with the actions bot token. Nothing here
# runs on pull_request.

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      redpanda_ref:
        description: 'A release tag (vX.Y.Z) to build and publish for its docs version even if already published. Empty: every supported version whose engine is missing or stale.'
        required: false
        default: ''
  # From the Redpanda release process:
  #   curl -X POST .../dispatches -d '{"event_type":"redpanda-release","client_payload":{"ref":"v26.2.1"}}'
  repository_dispatch:
    types: [redpanda-release]

concurrency:
  group: build-iceberg-engine
  cancel-in-progress: false

jobs:
  targets:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.RP_AWS_CRED_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.RP_AWS_CRED_ACCOUNT_ID }}:role/${{ vars.RP_AWS_CRED_BASE_ROLE_NAME }}${{ github.event.repository.name }}

      - uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            ,sdlc/prod/github/actions_bot_token
          parse-json-secrets: true

      - name: Pick the versions to build
        id: pick
        # The ref is event-controlled: pass it through env, never interpolate
        # it into the script. engine-targets.js rejects anything but vX.Y.Z.
        env:
          GH_TOKEN: ${{ env.ACTIONS_BOT_TOKEN }}
          REF_INPUT: ${{ github.event.inputs.redpanda_ref || github.event.client_payload.ref }}
        run: node iceberg-editor/ci/engine-targets.js "$REF_INPUT"

  build:
    needs: targets
    if: needs.targets.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.RP_AWS_CRED_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.RP_AWS_CRED_ACCOUNT_ID }}:role/${{ vars.RP_AWS_CRED_BASE_ROLE_NAME }}${{ github.event.repository.name }}

      - uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            ,sdlc/prod/github/actions_bot_token
          parse-json-secrets: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.3

      - name: Fetch Redpanda source + third-party deps
        working-directory: iceberg-editor/wasm-spike
        env:
          GH_TOKEN: ${{ env.ACTIONS_BOT_TOKEN }}
          REDPANDA_REF: ${{ matrix.target.ref }}
          # Publishing always builds from an immutable ref: env.sh's
          # require_pinned_ref() rejects a branch such as `dev`.
          REDPANDA_REQUIRE_PINNED: '1'
        run: |
          ./fetch-sources.sh
          ./third_party/fetch-deps.sh

      # The schema mapper shims track the current tree, so an older release's
      # mapper may not compile. Then the engine is built with the parser only
      # (the explorer draws its illustrative schema), and the run says so.
      - name: Build engine (web and Node)
        id: build
        working-directory: iceberg-editor/wasm
        env:
          REF: ${{ matrix.target.ref }}
        run: |
          set -euo pipefail
          schema=1
          if ! ./build.sh web; then
            echo "::warning::$REF: the Avro schema mapper did not compile; publishing the iceberg_mode parser only."
            schema=0
            ICEBERG_SCHEMA_MAPPER=0 ./build.sh web
          fi
          ICEBERG_SCHEMA_MAPPER="$schema" ./build.sh node
          echo "schema_mapper=$([ "$schema" = 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Run the release's own iceberg_mode tests
        working-directory: iceberg-editor/wasm
        run: ./build.sh test

      - name: Check the engine against the explorer and the upstream vectors
        run: npm run test:iceberg-engine

      - name: Stage versioned artifact
        env:
          VERSION: ${{ matrix.target.version }}
          REF: ${{ matrix.target.ref }}
          SCHEMA_MAPPER: ${{ steps.build.outputs.schema_mapper }}
        run: |
          set -euo pipefail
          V="$VERSION"
          # V lands in filenames and a sed replacement; engine-targets.js only
          # emits X.Y, and this keeps it that way.
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid engine version: $V" >&2
            exit 1
          fi
          mkdir -p dist
          cp src/static/iceberg-engine.js  "dist/iceberg-engine-$V.js"
          cp src/static/iceberg-engine.wasm "dist/iceberg-engine-$V.wasm"
          # The emscripten glue references the .wasm by its build name; rewrite
          # it to the versioned name so both files can coexist per version.
          sed -i "s/iceberg-engine\.wasm/iceberg-engine-$V.wasm/g" "dist/iceberg-engine-$V.js"
          COMMIT="$(cat iceberg-editor/wasm-spike/vendor/REDPANDA_COMMIT)"
          printf '{"engine_version":"%s","redpanda_ref":"%s","redpanda_commit":"%s","schema_mapper":%s,"docs_ui_commit":"%s"}\n' \
            "$V" "$REF" "$COMMIT" "$SCHEMA_MAPPER" "$GITHUB_SHA" >"dist/iceberg-engine-$V.json"
          ls -la dist

      - name: Upload versioned engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: iceberg-engine-${{ matrix.target.version }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: [targets, build]
    if: needs.targets.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.RP_AWS_CRED_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.RP_AWS_CRED_ACCOUNT_ID }}:role/${{ vars.RP_AWS_CRED_BASE_ROLE_NAME }}${{ github.event.repository.name }}

      - uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            ,sdlc/prod/github/actions_bot_token
          parse-json-secrets: true

      # A build that failed for one version has no artifact; that version's
      # publish fails here and the others carry on.
      - uses: actions/download-artifact@v4
        with:
          name: iceberg-engine-${{ matrix.target.version }}
          path: dist

      - name: Check out the docs branch for this version
        uses: actions/checkout@v4
        with:
          repository: redpanda-data/docs
          ref: ${{ matrix.target.branch }}
          path: docs
          token: ${{ env.ACTIONS_BOT_TOKEN }}

      - name: Add the engine to the reference attachments
        run: |
          set -euo pipefail
          mkdir -p docs/modules/reference/attachments
          cp dist/* docs/modules/reference/attachments/

      - name: Open or update the docs PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ env.ACTIONS_BOT_TOKEN }}
          path: docs
          base: ${{ matrix.target.branch }}
          branch: ${{ matrix.target.publish_branch }}
          commit-message: 'auto-docs: Update Iceberg engine for ${{ matrix.target.version }} to ${{ matrix.target.ref }}'
          title: 'auto-docs: Update Iceberg engine for ${{ matrix.target.version }} to ${{ matrix.target.ref }}'
          body: |
            Adds the Iceberg Mode Explorer engine built from Redpanda ${{ matrix.target.ref }} to `modules/reference/attachments/`.

            The explorer on ${{ matrix.target.version }} pages loads it to decide which `redpanda.iceberg.mode` values Redpanda accepts. Built by redpanda-data/docs-ui `build-iceberg-engine.yml` at ${{ github.sha }}; see `iceberg-engine-${{ matrix.target.version }}.json` for provenance.
          labels: auto-docs
